name: Passcit
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Passcit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Passcit
    info:
      path: Passcit/Resources/Info.plist
      properties:
        CFBundleDisplayName: Passcit
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        # Redirect target for Google's OAuth flow (ASWebAuthenticationSession).
        # This scheme MUST match GoogleOAuthConfig.reversedClientIDScheme —
        # update both together if the Google iOS client ID ever changes.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.1017542455339-if94tsjtie7adujqrfc51cm766fflrq9
        NSMicrophoneUsageDescription: "Passcit uses your microphone during interview practice so you can rehearse speaking your answers aloud."
        NSSpeechRecognitionUsageDescription: "Passcit uses on-device speech recognition to transcribe what you say during interview practice, so it can be submitted as your answer."
    entitlements:
      path: Passcit/Resources/Passcit.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudax.passcitapp
        DEVELOPMENT_TEAM: 4JFF7NGNB5
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PasscitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PasscitTests
    dependencies:
      - target: Passcit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudax.passcitapp.tests
        DEVELOPMENT_TEAM: 4JFF7NGNB5
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Passcit:
    build:
      targets:
        Passcit: all
        PasscitTests: [test]
    test:
      targets:
        - PasscitTests
    run:
      config: Debug
